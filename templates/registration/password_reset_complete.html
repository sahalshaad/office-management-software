{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password updated · PRE.POC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body class="auth-body">
  <main class="auth-shell compact-auth">
    <section class="auth-panel surface">
      <div class="brand brand-auth"><span class="brand-mark">PP</span><span>PRE.POC</span></div>
      <h1>Password updated</h1>
      <p>Your password has been changed successfully. Log in to continue to your dashboard.</p>
      <div class="form-actions">
        <a class="btn btn-primary btn-lg" href="{% url 'accounts:login' %}">Go to login</a>
      </div>
    </section>
  </main>
</body>
</html>
