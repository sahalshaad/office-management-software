{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password reset sent · PRE.POC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body class="auth-body">
  <main class="auth-shell compact-auth">
    <section class="auth-panel surface">
      <div class="brand brand-auth"><span class="brand-mark">PP</span><span>PRE.POC</span></div>
      <h1>Reset link sent</h1>
      <p>We’ve emailed a password reset link to your address. Follow the instructions in the email to continue.</p>
      <div class="form-actions">
        <a class="auth-link" href="{% url 'accounts:login' %}">Back to login</a>
      </div>
    </section>
  </main>
</body>
</html>
