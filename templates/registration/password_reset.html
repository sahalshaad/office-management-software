{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password reset · PRE.POC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body class="auth-body">
  <main class="auth-shell compact-auth">
    <section class="auth-panel surface">
      <div class="brand brand-auth"><span class="brand-mark">PP</span><span>PRE.POC</span></div>
      <div>
        <h1>Reset password</h1>
        <p>Enter your email address and we’ll send a secure reset link.</p>
      </div>
      <form method="post" class="stack-form" novalidate>
        {% csrf_token %}
        <div class="form-field">
          <label for="{{ form.email.id_for_label }}">Email address</label>
          {{ form.email }}
          {% if form.email.errors %}<div class="text-danger small" style="color:var(--danger)">{{ form.email.errors }}</div>{% endif %}
        </div>
        <button class="btn btn-primary btn-lg" type="submit" style="margin-top:0.5rem;">Send reset link</button>
      </form>
      <div class="form-actions">
        <a class="auth-link" href="{% url 'accounts:login' %}">Back to login</a>
      </div>
    </section>
  </main>
</body>
</html>
