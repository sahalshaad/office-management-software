{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password reset · OfficeFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body class="auth-body">
  <main class="auth-shell compact-auth">
    <section class="auth-panel">
      <div class="brand brand-auth"><span class="brand-mark">OF</span><span>OfficeFlow</span></div>
      <h1>Reset password</h1>
      <form method="post" class="stack-form">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary w-100">Send reset link</button></form>
      <a class="auth-link" href="{% url 'accounts:login' %}">Back to login</a>
    </section>
  </main>
</body>
</html>
