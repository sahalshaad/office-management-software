{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set password · PRE.POC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body class="auth-body">
  <main class="auth-shell compact-auth">
    <section class="auth-panel surface">
      <div class="brand brand-auth"><span class="brand-mark">PP</span><span>PRE.POC</span></div>
      <div>
        <h1>Create new password</h1>
        <p>Set a strong password to secure your account.</p>
      </div>
      <form method="post" class="stack-form" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary btn-lg" type="submit">Save password</button>
      </form>
      <div class="form-actions">
        <a class="auth-link" href="{% url 'accounts:login' %}">Back to login</a>
      </div>
    </section>
  </main>
</body>
</html>
