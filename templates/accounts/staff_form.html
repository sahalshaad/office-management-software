{% extends "base/app.html" %}
{% block page_title %}{% if object %}Edit Staff{% else %}Add Staff{% endif %}{% endblock %}
{% block content %}
<form method="post" enctype="multipart/form-data" class="surface of-form">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="form-actions">
    <button class="btn btn-primary">Save</button>
    <a class="btn btn-light" href="{% url 'accounts:staff_list' %}">Cancel</a>
  </div>
</form>
{% endblock %}
